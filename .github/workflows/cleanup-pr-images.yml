name: Cleanup PR GHCR images

on:
  pull_request_target:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr:
        description: Closed pull request number to clean up
        required: true
        type: number

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.repository.default_branch }}
          persist-credentials: false
      - name: Delete only this PR's package versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
        run: python3 scripts/cleanup-pr-images.py
