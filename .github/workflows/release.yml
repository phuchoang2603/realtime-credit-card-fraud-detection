name: Service images

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - infra/charts/payment-gateway/values-prod.yaml
      - infra/charts/fraud-service/values-prod.yaml
      - infra/charts/kafka/values-prod.yaml

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  images:
    name: ${{ matrix.service }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: fraud
            image-suffix: ""
            context: src/fraud-service
            dockerfile: infra/docker/fraud-service.Dockerfile
          - service: edge
            image-suffix: /edge
            context: .
            dockerfile: infra/docker/go-service.Dockerfile
            build-args: |
              SERVICE_PATH=src/payment-gateway/edge
              BUILD_PKG=./cmd/edge
              BUILD_BIN=edge
              EXPOSE_PORT=8080
          - service: payments
            image-suffix: /payments
            context: .
            dockerfile: infra/docker/go-service.Dockerfile
            build-args: |
              SERVICE_PATH=src/payment-gateway/payments
              BUILD_PKG=./cmd/payments
              BUILD_BIN=payments
              EXPOSE_PORT=8000
          - service: notifier
            image-suffix: /notifier
            context: .
            dockerfile: infra/docker/go-service.Dockerfile
            build-args: |
              SERVICE_PATH=src/payment-gateway/notifier
              BUILD_PKG=./cmd/notifier
              BUILD_BIN=notifier
              EXPOSE_PORT=8000
          - service: vault-simulator
            image-suffix: /vault-simulator
            context: .
            dockerfile: infra/docker/go-service.Dockerfile
            build-args: |
              SERVICE_PATH=src/payment-gateway/vault-simulator
              BUILD_PKG=./cmd/vault-simulator
              BUILD_BIN=vault-simulator
              EXPOSE_PORT=8000
          - service: processor-simulator
            image-suffix: /processor-simulator
            context: .
            dockerfile: infra/docker/go-service.Dockerfile
            build-args: |
              SERVICE_PATH=src/payment-gateway/processor-simulator
              BUILD_PKG=./cmd/processor-simulator
              BUILD_BIN=processor-simulator
              EXPOSE_PORT=8000
          - service: connect-debezium
            image-suffix: /connect-debezium
            context: .
            dockerfile: infra/docker/connect-debezium.Dockerfile
    uses: ./.github/workflows/build-image.yml
    with:
      image: ${{ github.repository }}${{ matrix.image-suffix }}
      context: ${{ matrix.context }}
      dockerfile: ${{ matrix.dockerfile }}
      build-args: ${{ matrix.build-args || '' }}
      publish: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
