name: Service images

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      service:
        type: choice
        default: fraud
        options: [fraud, edge, all]
        description: Service image to publish from the selected revision

permissions:
  contents: read
  packages: write

jobs:
  fraud:
    if: github.event_name != 'workflow_dispatch' || inputs.service == 'fraud' || inputs.service == 'all'
    uses: ./.github/workflows/build-image.yml
    with:
      image: ${{ github.repository }}
      context: src/fraud-service
      dockerfile: infra/docker/fraud-service.Dockerfile
      publish: ${{ github.event_name != 'pull_request' }}
  edge:
    if: github.event_name != 'workflow_dispatch' || inputs.service == 'edge' || inputs.service == 'all'
    uses: ./.github/workflows/build-image.yml
    with:
      image: ${{ github.repository }}/edge
      context: .
      dockerfile: infra/docker/go-service.Dockerfile
      build-args: |
        SERVICE_PATH=src/edge
        BUILD_PKG=./cmd/edge
        BUILD_BIN=edge
        EXPOSE_PORT=8080
      publish: ${{ github.event_name != 'pull_request' }}
