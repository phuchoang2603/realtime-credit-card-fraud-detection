name: Service images

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  fraud:
    uses: ./.github/workflows/build-image.yml
    with:
      image: ${{ github.repository }}
      context: src/fraud-service
      dockerfile: infra/docker/fraud-service.Dockerfile
      publish: ${{ github.event_name == 'push' }}
  edge:
    uses: ./.github/workflows/build-image.yml
    with:
      image: ${{ github.repository }}/edge
      context: .
      dockerfile: infra/docker/go-service.Dockerfile
      build-args: |
        SERVICE_PATH=src/edge
        BUILD_PKG=./cmd/edge
        BUILD_BIN=edge
        EXPOSE_PORT=8080
      publish: ${{ github.event_name == 'push' }}
