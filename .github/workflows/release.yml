name: Service images

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      service:
        type: choice
        default: fraud
        options: [fraud, edge, payments, notifier, vault-simulator, processor-simulator, connect-debezium, all]
        description: Service image to publish from the selected revision

permissions:
  contents: read
  packages: write

jobs:
  fraud:
    if: github.event_name != 'workflow_dispatch' || inputs.service == 'fraud' || inputs.service == 'all'
    uses: ./.github/workflows/build-image.yml
    with:
      image: ${{ github.repository }}
      context: src/payment-gateway/fraud-service
      dockerfile: infra/docker/fraud-service.Dockerfile
      publish: ${{ github.event_name != 'pull_request' }}
  edge:
    if: github.event_name != 'workflow_dispatch' || inputs.service == 'edge' || inputs.service == 'all'
    uses: ./.github/workflows/build-image.yml
    with:
      image: ${{ github.repository }}/edge
      context: .
      dockerfile: infra/docker/go-service.Dockerfile
      build-args: |
        SERVICE_PATH=src/payment-gateway/edge
        BUILD_PKG=./cmd/edge
        BUILD_BIN=edge
        EXPOSE_PORT=8080
      publish: ${{ github.event_name != 'pull_request' }}
  payments:
    if: github.event_name != 'workflow_dispatch' || inputs.service == 'payments' || inputs.service == 'all'
    uses: ./.github/workflows/build-image.yml
    with:
      image: ${{ github.repository }}/payments
      context: .
      dockerfile: infra/docker/go-service.Dockerfile
      build-args: |
        SERVICE_PATH=src/payment-gateway/payments
        BUILD_PKG=./cmd/payments
        BUILD_BIN=payments
        EXPOSE_PORT=8000
      publish: ${{ github.event_name != 'pull_request' }}
  notifier:
    if: github.event_name != 'workflow_dispatch' || inputs.service == 'notifier' || inputs.service == 'all'
    uses: ./.github/workflows/build-image.yml
    with:
      image: ${{ github.repository }}/notifier
      context: .
      dockerfile: infra/docker/go-service.Dockerfile
      build-args: |
        SERVICE_PATH=src/payment-gateway/notifier
        BUILD_PKG=./cmd/notifier
        BUILD_BIN=notifier
        EXPOSE_PORT=8000
      publish: ${{ github.event_name != 'pull_request' }}
  vault-simulator:
    if: github.event_name != 'workflow_dispatch' || inputs.service == 'vault-simulator' || inputs.service == 'all'
    uses: ./.github/workflows/build-image.yml
    with:
      image: ${{ github.repository }}/vault-simulator
      context: .
      dockerfile: infra/docker/go-service.Dockerfile
      build-args: |
        SERVICE_PATH=src/payment-gateway/vault-simulator
        BUILD_PKG=./cmd/vault-simulator
        BUILD_BIN=vault-simulator
        EXPOSE_PORT=8000
      publish: ${{ github.event_name != 'pull_request' }}
  processor-simulator:
    if: github.event_name != 'workflow_dispatch' || inputs.service == 'processor-simulator' || inputs.service == 'all'
    uses: ./.github/workflows/build-image.yml
    with:
      image: ${{ github.repository }}/processor-simulator
      context: .
      dockerfile: infra/docker/go-service.Dockerfile
      build-args: |
        SERVICE_PATH=src/payment-gateway/processor-simulator
        BUILD_PKG=./cmd/processor-simulator
        BUILD_BIN=processor-simulator
        EXPOSE_PORT=8000
      publish: ${{ github.event_name != 'pull_request' }}
  connect-debezium:
    if: github.event_name != 'workflow_dispatch' || inputs.service == 'connect-debezium' || inputs.service == 'all'
    uses: ./.github/workflows/build-image.yml
    with:
      image: ${{ github.repository }}/connect-debezium
      context: .
      dockerfile: infra/docker/connect-debezium.Dockerfile
      publish: ${{ github.event_name != 'pull_request' }}
