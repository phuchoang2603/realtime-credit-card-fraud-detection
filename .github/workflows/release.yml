name: Service images

on:
  pull_request:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      service:
        type: choice
        default: fraud
        options: [fraud, edge, payments, notifier, vault-simulator, processor-simulator, connect-debezium, all]
        description: Service image to publish from the selected revision

permissions:
  contents: read
  packages: write

jobs:
  fraud:
    if: github.event_name != 'workflow_dispatch' || inputs.service == 'fraud' || inputs.service == 'all'
    uses: ./.github/workflows/build-image.yml
    with:
      image: ${{ github.repository }}
      context: src/fraud-service
      dockerfile: infra/docker/fraud-service.Dockerfile
      publish: ${{ github.event_name != 'pull_request' }}
  edge:
    if: github.event_name != 'workflow_dispatch' || inputs.service == 'edge' || inputs.service == 'all'
    uses: ./.github/workflows/build-image.yml
    with:
      image: ${{ github.repository }}/edge
      context: .
      dockerfile: infra/docker/go-service.Dockerfile
      build-args: |
        SERVICE_PATH=src/payment-gateway/edge
        BUILD_PKG=./cmd/edge
        BUILD_BIN=edge
        EXPOSE_PORT=8080
      publish: ${{ github.event_name != 'pull_request' }}
  payments:
    if: github.event_name != 'workflow_dispatch' || inputs.service == 'payments' || inputs.service == 'all'
    uses: ./.github/workflows/build-image.yml
    with:
      image: ${{ github.repository }}/payments
      context: .
      dockerfile: infra/docker/go-service.Dockerfile
      build-args: |
        SERVICE_PATH=src/payment-gateway/payments
        BUILD_PKG=./cmd/payments
        BUILD_BIN=payments
        EXPOSE_PORT=8000
      publish: ${{ github.event_name != 'pull_request' }}
  notifier:
    if: github.event_name != 'workflow_dispatch' || inputs.service == 'notifier' || inputs.service == 'all'
    uses: ./.github/workflows/build-image.yml
    with:
      image: ${{ github.repository }}/notifier
      context: .
      dockerfile: infra/docker/go-service.Dockerfile
      build-args: |
        SERVICE_PATH=src/payment-gateway/notifier
        BUILD_PKG=./cmd/notifier
        BUILD_BIN=notifier
        EXPOSE_PORT=8000
      publish: ${{ github.event_name != 'pull_request' }}
  vault-simulator:
    if: github.event_name != 'workflow_dispatch' || inputs.service == 'vault-simulator' || inputs.service == 'all'
    uses: ./.github/workflows/build-image.yml
    with:
      image: ${{ github.repository }}/vault-simulator
      context: .
      dockerfile: infra/docker/go-service.Dockerfile
      build-args: |
        SERVICE_PATH=src/payment-gateway/vault-simulator
        BUILD_PKG=./cmd/vault-simulator
        BUILD_BIN=vault-simulator
        EXPOSE_PORT=8000
      publish: ${{ github.event_name != 'pull_request' }}
  processor-simulator:
    if: github.event_name != 'workflow_dispatch' || inputs.service == 'processor-simulator' || inputs.service == 'all'
    uses: ./.github/workflows/build-image.yml
    with:
      image: ${{ github.repository }}/processor-simulator
      context: .
      dockerfile: infra/docker/go-service.Dockerfile
      build-args: |
        SERVICE_PATH=src/payment-gateway/processor-simulator
        BUILD_PKG=./cmd/processor-simulator
        BUILD_BIN=processor-simulator
        EXPOSE_PORT=8000
      publish: ${{ github.event_name != 'pull_request' }}
  connect-debezium:
    if: github.event_name != 'workflow_dispatch' || inputs.service == 'connect-debezium' || inputs.service == 'all'
    uses: ./.github/workflows/build-image.yml
    with:
      image: ${{ github.repository }}/connect-debezium
      context: .
      dockerfile: infra/docker/connect-debezium.Dockerfile
      publish: ${{ github.event_name != 'pull_request' }}

  pin:
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    needs: [fraud, edge, payments, notifier, vault-simulator, processor-simulator, connect-debezium]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Pin the prod charts to the released images
        run: |
          tag="${GITHUB_SHA::7}"
          pin() {
            file=$1
            pattern=$2
            replacement=$3
            count=$(grep -cE "$pattern" "$file")
            if [ "$count" -ne 1 ]; then
              echo "expected exactly one match for '${pattern}' in ${file}, found ${count}"
              exit 1
            fi
            sed -i -E "s|${pattern}|${replacement}|" "$file"
          }
          pin infra/charts/payment-gateway/values-prod.yaml '^imageTag: .*$' "imageTag: ${tag}"
          pin infra/charts/fraud-service/values-prod.yaml '^  tag: ".*"$' "  tag: \"${tag}\""
          pin infra/charts/kafka/values-prod.yaml '^  imageTag: .*$' "  imageTag: ${tag}"
          if git diff --quiet; then
            echo "image tags already at ${tag}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add infra/charts/payment-gateway/values-prod.yaml infra/charts/fraud-service/values-prod.yaml infra/charts/kafka/values-prod.yaml
          git commit -m "chore(infra): track service images ${tag} [skip ci]"
          git push
