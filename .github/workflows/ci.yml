name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: src/fraud-service/uv.lock
      - working-directory: src/fraud-service
        run: uv sync --locked --dev
      - working-directory: src/fraud-service
        run: uv run --locked ruff check app tests tools --output-format=github
      - working-directory: src/fraud-service
        run: uv run --locked ruff format --check app tests tools
      - working-directory: src/fraud-service
        run: TESTING_MODE=true uv run --locked pytest --cov=app --cov-report=term-missing --cov-fail-under=80 tests
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint infra/charts/fraud-service
      - run: helm template test infra/charts/fraud-service --namespace payment-gateway
      - run: helm lint infra/argocd/app-of-apps
      - run: helm template dev-root infra/argocd/app-of-apps --set destinationName=dev --set namePrefix=payment-gateway-dev
      - run: helm template prod-root infra/argocd/app-of-apps --set destinationName=prod --set namePrefix=payment-gateway-prod
