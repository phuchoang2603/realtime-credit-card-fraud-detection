name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: src/fraud-service/uv.lock
      - working-directory: src/fraud-service
        run: uv sync --locked --dev
      - working-directory: src/fraud-service
        run: uv run --locked ruff check app tests tools --output-format=github
      - working-directory: src/fraud-service
        run: uv run --locked ruff format --check app tests tools
      - working-directory: src/fraud-service
        run: TESTING_MODE=true uv run --locked pytest --cov=app --cov-report=term-missing --cov-fail-under=80 tests
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.18.6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install manifest parser
        run: python -m pip install PyYAML==6.0.3
      - name: Install pinned Prometheus rule checker
        env:
          PROMETHEUS_VERSION: 3.5.0
        run: |
          set -euo pipefail
          archive="prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz"
          download_dir="$(mktemp -d)"
          cd "$download_dir"
          base="https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}"
          curl --fail --location --retry 3 "$base/$archive" -o "$archive"
          curl --fail --location --retry 3 "$base/sha256sums.txt" -o sha256sums.txt
          grep " $archive$" sha256sums.txt | sha256sum --check --strict
          tar -xzf "$archive" --strip-components=1 "prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool"
          echo "$download_dir" >> "$GITHUB_PATH"
      - name: Validate GitOps, telemetry resources, dashboards, and alert behavior
        run: python scripts/ci/validate_deployments.py
      - name: Retain rendered validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: helm-validation
          path: artifacts/helm/
          if-no-files-found: ignore
