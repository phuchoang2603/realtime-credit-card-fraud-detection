name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: src/fraud-service/uv.lock
      - name: Python lint, format and behavior tests
        working-directory: src/fraud-service
        run: |
          uv run --locked ruff check app tests
          uv run --locked ruff format --check app tests
          uv run --locked pytest -q

  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v6.5.0
        with:
          go-version-file: src/edge/go.mod
          cache-dependency-path: src/edge/go.sum
      - name: Go format, vet and build
        working-directory: src/edge
        env:
          GOWORK: "off"
        run: |
          test -z "$(gofmt -l cmd internal)"
          go vet ./...
          go build ./...

  helm:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: azure/setup-helm@v4.3.1
      - name: Lint and render all charts
        shell: bash
        run: |
          shopt -s nullglob
          while IFS= read -r -d '' manifest; do
            chart=$(dirname "$manifest")
            helm lint "$chart"
            helm template check "$chart" > /dev/null
            for values in "$chart"/values-*.yaml; do
              helm lint "$chart" -f "$values"
              helm template check "$chart" -f "$values" > /dev/null
            done
          done < <(git ls-files -z -- '**/Chart.yaml' 'Chart.yaml')
