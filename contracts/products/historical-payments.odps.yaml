apiVersion: v1.1.0
kind: DataProduct
id: urn:dataproduct:fraud:historical-payments
name: Historical synthetic payments
version: 1.0.0
status: active
domain: fraud-detection
type: sourceAligned
description:
  purpose: Reproducible synthetic payment histories and delayed fraud labels for pipeline development.
  usage: Select a completed immutable dataset by its manifest. Use the referenced ODCS agreement for schemas, lifecycle validation and label semantics.
  limitations: Synthetic source only; no claim of real-world fraud performance, production model acceptance or processing benchmark scale. Drift and history duration depend on the selected dataset configuration.
team:
  name: Fraud data platform
  members:
    - username: phuchoang2603
      role: owner
tags: [synthetic, source, payments]
outputPorts:
  - name: historical-payments
    version: 1.0.0
    type: files
    contractId: urn:datacontract:fraud:historical-payments
    description: Complete payment_events and separate fraud_labels in date-partitioned Parquet, with a last-written manifest and native validation report.
    customProperties:
      - property: endpoint
        value: https://minio.home.phuchoang.sbs
      - property: locationTemplate
        value: s3://synthetic-source/historical/{dataset_version}/
      - property: completionMarker
        value: manifest.json
      - property: accessPolicy
        value: Shared historical-source identity from Doppler prd; historical/* list/read/write, no deletion or pipeline artifact access. Accepted versions are immutable by publication protocol.
      - property: consumption
        value: Deduplicate identical event deliveries, read complete histories across occurrence dates, exclude feature warmup and join labels only after label_available_at. Drift metadata is manifest-only.
    authoritativeDefinitions:
      - type: dataContract
        url: https://github.com/phuchoang2603/realtime-credit-card-fraud-detection/blob/main/contracts/data/historical-payments.odcs.yaml
      - type: implementation
        url: https://github.com/phuchoang2603/realtime-credit-card-fraud-detection/tree/main/src/simulator
support:
  - channel: GitHub issues
    url: https://github.com/phuchoang2603/realtime-credit-card-fraud-detection/issues
    scope: issues
