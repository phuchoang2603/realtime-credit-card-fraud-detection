syntax = "proto3";
package payments.v1;
import "google/protobuf/timestamp.proto";

// Amounts are integer minor units in the specified ISO 4217 currency.
message Money { int64 minor_units = 1; string currency = 2; }
message MerchantRef { string merchant_id = 1; string external_seller_id = 2; }
message CustomerRef { string customer_id = 1; string external_buyer_id = 2; }
message LineItem {
  string product_id = 1;
  string category = 2;
  string condition = 3;
  int32 quantity = 4;
  Money unit_price = 5;
}
message ShippingLocation {
  string country = 1;
  string region = 2;
  string postal_code = 3;
  string address_fingerprint = 4;
}
// Frozen at payment creation. No buyer PII, street lines or raw credentials.
message CheckoutSnapshot {
  string external_order_id = 1;
  Money total = 2;
  repeated LineItem items = 3;
  string merchant_category = 4;
  google.protobuf.Timestamp merchant_account_created_at = 5;
  google.protobuf.Timestamp customer_account_created_at = 6;
  ShippingLocation shipping = 7;
}
message PaymentMethod { string type = 1; string fingerprint = 2; }
// Unobserved optional signals remain absent, not empty or zero.
message AttemptSignals {
  google.protobuf.Timestamp attempted_at = 1;
  PaymentMethod payment_method = 2;
  optional string device_fingerprint = 3;
  optional string ip_country = 4;
  optional string ip_network_fingerprint = 5;
  optional string user_agent_family = 6;
}
