[project]
name = "realtime-credit-card-fraud-detection"
version = "2.0.0"
description = "Independently deployable fraud decision service"
requires-python = ">=3.14,<3.15"
dependencies = [
    "grpcio>=1.84,<2",
    "grpcio-health-checking>=1.84,<2",
    "opentelemetry-api>=1.38,<2",
    "opentelemetry-exporter-otlp>=1.38,<2",
    "opentelemetry-sdk>=1.38,<2",
    "prometheus-client>=0.23,<1",
    "pydantic>=2.12,<3",
    "protobuf>=7.36.1,<8",
    "structlog>=25.4,<26",
]

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "ruff>=0.14,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "gen"]

[tool.ruff]
extend-exclude = ["gen"]
line-length = 119
src = [".", "gen"]
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "double"
