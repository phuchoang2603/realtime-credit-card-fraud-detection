[project]
name = "realtime-credit-card-fraud-detection"
version = "1.1.0"
description = "Add your description here"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.119,<1",
    "numpy>=2.3.3,<3",
    "opentelemetry-api>=1.38,<2",
    "opentelemetry-exporter-otlp>=1.38,<2",
    "opentelemetry-exporter-prometheus>=0.59b0,<1",
    "opentelemetry-instrumentation-fastapi>=0.59b0,<1",
    "opentelemetry-sdk>=1.38,<2",
    "pandas>=2.3.3,<3",
    "prometheus-client>=0.23,<1",
    "pydantic>=2.12,<3",
    "requests>=2.32.4,<3",
    "scikit-learn>=1.8,<2",
    "structlog>=25.4,<26",
    "uvicorn[standard]>=0.38,<1",
]

[dependency-groups]
dev = [
    "httpx2>=2.13,<3",
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "ruff>=0.14,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 119
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "double"
