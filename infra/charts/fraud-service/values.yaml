replicaCount: 2
ingress:
  enabled: true
  name: payment-gateway-ingress
  hostname: fraud-dev.phuchoang.sbs
  port: 80
image:
  repository: "ghcr.io/phuchoang2603/realtime-credit-card-fraud-detection"
  tag: "latest"
  pullPolicy: Always
service:
  type: ClusterIP
env:
  - name: MODEL_PATH
    value: /app/models/model.pkl
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

livenessProbe:
  enabled: true
  initialDelaySeconds: 15
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 3
readinessProbe:
  enabled: true
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
podScrape:
  enabled: true
  labels:
    release: victoria
  interval: 15s
  scrapeTimeout: 10s
rules:
  enabled: true
  labels: {}
  unavailableFor: 10m
dashboards:
  enabled: true
  labels:
    grafana_dashboard: "1"
  datasources:
    metrics: VictoriaMetrics
    logs: VictoriaLogs
    traces: VictoriaTraces

telemetry:
  serviceName: fraud-service
  traceEndpoint: vtsingle-vmks.monitoring.svc.cluster.local:4317
