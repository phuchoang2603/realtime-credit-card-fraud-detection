replicaCount: 2
image:
  repository: "ghcr.io/phuchoang2603/realtime-credit-card-fraud-detection"
  tag: "latest"
  pullPolicy: Always
service:
  type: ClusterIP
env: []
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

livenessProbe:
  enabled: true
  initialDelaySeconds: 15
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 3
readinessProbe:
  enabled: true
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
telemetry:
  serviceName: fraud-service

# Drain (30s) plus bounded telemetry/metrics cleanup and scheduling margin.
terminationGracePeriodSeconds: 40
