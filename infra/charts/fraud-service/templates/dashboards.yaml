{{- if .Values.dashboards.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-dashboard
  namespace: {{ .Release.Namespace }}
  labels:
    {{- toYaml .Values.dashboards.labels | nindent 4 }}
data:
  fraud-service.json: |-
    {{- .Files.Get "dashboards/fraud-service.json" | replace "__METRICS_UID__" .Values.dashboards.datasources.metrics | replace "__LOGS_UID__" .Values.dashboards.datasources.logs | replace "__TRACES_UID__" .Values.dashboards.datasources.traces | replace "__NAMESPACE__" .Release.Namespace | replace "__RELEASE__" .Release.Name | replace "__SERVICE__" .Values.telemetry.serviceName | nindent 4 }}
{{- end }}
