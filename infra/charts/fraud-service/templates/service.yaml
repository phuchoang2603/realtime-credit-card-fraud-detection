apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    payment-gateway/release: {{ .Release.Name }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: 8000
      targetPort: grpc
      protocol: TCP
      name: grpc
      appProtocol: kubernetes.io/h2c
    - port: 8010
      targetPort: http-metrics
      protocol: TCP
      name: http-metrics
  selector:
    app.kubernetes.io/name: {{ .Release.Name }}
    payment-gateway/release: {{ .Release.Name }}
