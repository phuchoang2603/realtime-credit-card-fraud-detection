{{- if .Values.ingress.enabled }}
{{- $gatewayName := default "payment-gateway-ingress" .Values.ingress.name }}
{{- $hostname := required "ingress.hostname is required when ingress.enabled is true" .Values.ingress.hostname }}
{{- $port := default 80 .Values.ingress.port }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ $gatewayName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  gatewayClassName: cilium
  listeners:
    - name: http
      port: {{ $port }}
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: fraud-service
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  parentRefs:
    - name: {{ $gatewayName }}
  hostnames:
    - {{ $hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: X-Forwarded-Proto
                value: https
              - name: X-Forwarded-Host
                value: {{ $hostname | quote }}
      backendRefs:
        - name: {{ .Release.Name }}
          port: 8000
{{- end }}
