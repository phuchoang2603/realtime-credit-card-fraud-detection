{{- if .Values.rules.enabled }}
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  {{- with .Values.rules.labels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  groups:
    - name: fraud-service
      rules:
        - alert: FraudServiceMetricsUnavailable
          expr: up{namespace="{{ .Release.Namespace }}",job="{{ .Release.Name }}"} == 0 or absent(up{namespace="{{ .Release.Namespace }}",job="{{ .Release.Name }}"})
          for: {{ .Values.rules.unavailableFor }}
          labels:
            severity: warning
            service: {{ .Values.telemetry.serviceName | quote }}
          annotations:
            summary: Fraud service metrics are unavailable
{{- end }}
