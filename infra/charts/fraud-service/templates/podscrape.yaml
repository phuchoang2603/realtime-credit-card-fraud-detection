{{- if .Values.podScrape.enabled }}
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- toYaml .Values.podScrape.labels | nindent 4 }}
spec:
  namespaceSelector:
    any: false
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  # This defines which port on the pod to scrape.
  podMetricsEndpoints:
  - port: http-metrics
    path: /metrics
    {{- with .Values.podScrape.interval }}
    interval: {{ . }}
    {{- end }}
    {{- with .Values.podScrape.scrapeTimeout }}
    scrapeTimeout: {{ . }}
    {{- end }}
{{- end }}
