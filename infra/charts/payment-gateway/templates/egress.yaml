{{- range $name, $settings := .Values.services }}
{{- if $settings.enabled }}
{{- $svc := mergeOverwrite (deepCopy $.Values.defaults) $settings }}
---
{{- with $svc.networkPolicy.egress }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}-egress
  namespace: {{ $.Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      {{- include "payment-gateway.selector" $name | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    {{- toYaml . | nindent 4 }}
{{- end }}
{{- end }}
{{- end }}
