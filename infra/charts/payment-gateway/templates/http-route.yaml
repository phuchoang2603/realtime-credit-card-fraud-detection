{{- range $name, $settings := .Values.services }}
{{- if $settings.enabled }}
{{- $svc := mergeOverwrite (deepCopy $.Values.defaults) $settings }}
---
{{- if $svc.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
spec:
  parentRefs:
    - name: {{ $svc.httpRoute.gateway }}
  {{- with $svc.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ $svc.httpRoute.pathPrefix }}
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: X-Forwarded-Proto
                value: https
      timeouts:
        {{- toYaml $svc.httpRoute.timeouts | nindent 8 }}
      backendRefs:
        - name: {{ $name }}
          port: {{ $svc.httpRoute.port }}
{{- end }}
{{- end }}
{{- end }}
