{{- range $name, $settings := .Values.services }}
{{- if $settings.enabled }}
{{- $svc := mergeOverwrite (deepCopy $.Values.defaults) $settings }}
---
{{- range $svc.externalSecrets }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace }}
spec:
  refreshInterval: {{ default "1h" .refreshInterval }}
  secretStoreRef:
    kind: {{ $svc.secretStoreRef.kind }}
    name: {{ $svc.secretStoreRef.name }}
  target:
    name: {{ .name }}
    creationPolicy: Owner
    {{- with .template }}
    template:
      engineVersion: v2
      data:
        {{- range $key, $value := . }}
        {{ $key }}: {{ $value | quote }}
        {{- end }}
    {{- end }}
  data:
    {{- range .data }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ .remoteKey }}
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
