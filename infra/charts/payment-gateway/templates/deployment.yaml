{{- range $name, $settings := .Values.services }}
{{- if $settings.enabled }}
{{- $svc := mergeOverwrite (deepCopy $.Values.defaults) $settings }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "payment-gateway.selector" $name | nindent 4 }}
spec:
  replicas: {{ $svc.replicaCount }}
  selector:
    matchLabels:
      {{- include "payment-gateway.selector" $name | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "payment-gateway.selector" $name | nindent 8 }}
        {{- if $svc.mesh.enabled }}
        istio.io/dataplane-mode: ambient
        {{- end }}
    spec:
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ $svc.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      {{- if $svc.migrate.enabled }}
      initContainers:
        - name: migrate
          image: "{{ $svc.image.repository }}:{{ $svc.image.tag }}"
          imagePullPolicy: {{ $svc.image.pullPolicy }}
          args: [migrate]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          {{- with $svc.migrate.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: "{{ $svc.image.repository }}:{{ $svc.image.tag }}"
          imagePullPolicy: {{ $svc.image.pullPolicy }}
          {{- with $svc.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            {{- range $svc.ports }}
            - name: {{ .name }}
              containerPort: {{ .containerPort }}
              protocol: TCP
            {{- end }}
          {{- with $svc.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $svc.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if eq $svc.probes.type "grpc" }}
          livenessProbe:
            grpc:
              port: {{ $svc.probes.grpcPort }}
              service: liveness
            {{- toYaml $svc.probes.liveness | nindent 12 }}
          readinessProbe:
            grpc:
              port: {{ $svc.probes.grpcPort }}
              service: readiness
            {{- toYaml $svc.probes.readiness | nindent 12 }}
          {{- else if eq $svc.probes.type "http" }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ $svc.probes.httpPort }}
            {{- toYaml $svc.probes.liveness | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /ready
              port: {{ $svc.probes.httpPort }}
            {{- toYaml $svc.probes.readiness | nindent 12 }}
          {{- else if eq $svc.probes.type "exec" }}
          livenessProbe:
            exec:
              command:
                {{- toYaml (concat $svc.probes.exec.command (list "liveness")) | nindent 16 }}
            {{- toYaml $svc.probes.liveness | nindent 12 }}
          readinessProbe:
            exec:
              command:
                {{- toYaml (concat $svc.probes.exec.command (list "readiness")) | nindent 16 }}
            {{- toYaml $svc.probes.readiness | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
      {{- with $svc.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
