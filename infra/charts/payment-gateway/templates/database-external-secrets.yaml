{{- range .Values.database.roles }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $.Values.database.name }}-{{ .name | replace "_" "-" }}
  namespace: {{ $.Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: {{ $.Values.database.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: {{ $.Values.database.externalSecrets.secretStoreRef.kind }}
    name: {{ $.Values.database.externalSecrets.secretStoreRef.name }}
  target:
    name: {{ $.Values.database.name }}-{{ .name | replace "_" "-" }}
    creationPolicy: Owner
    template:
      metadata:
        labels:
          cnpg.io/reload: "true"
      type: kubernetes.io/basic-auth
      engineVersion: v2
      data:
        username: {{ .name | quote }}
        password: "{{`{{ .password }}`}}"
  data:
    - secretKey: password
      remoteRef:
        key: GATEWAY_DB_{{ .name | upper }}_PASSWORD
{{- end }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: payments-cdc
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: {{ .Values.database.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.database.externalSecrets.secretStoreRef.kind }}
    name: {{ .Values.database.externalSecrets.secretStoreRef.name }}
  target:
    name: payments-cdc
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        username: payments_cdc
        password: "{{`{{ .password }}`}}"
  data:
    - secretKey: password
      remoteRef:
        key: GATEWAY_DB_PAYMENTS_CDC_PASSWORD
