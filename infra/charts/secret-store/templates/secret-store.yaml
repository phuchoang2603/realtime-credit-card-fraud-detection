{{- if .Values.secretStore.enabled }}
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ required "secretStore.name is required" .Values.secretStore.name }}
spec:
  conditions:
    - namespaces:
        {{- toYaml (required "secretStore.namespaces is required" .Values.secretStore.namespaces) | nindent 8 }}
  provider:
    doppler:
      project: {{ required "secretStore.project is required" .Values.secretStore.project }}
      config: {{ required "secretStore.config is required" .Values.secretStore.config }}
      auth:
        secretRef:
          dopplerToken:
            namespace: {{ required "secretStore.tokenSecret.namespace is required" .Values.secretStore.tokenSecret.namespace }}
            name: {{ required "secretStore.tokenSecret.name is required" .Values.secretStore.tokenSecret.name }}
            key: {{ required "secretStore.tokenSecret.key is required" .Values.secretStore.tokenSecret.key }}
{{- end }}
