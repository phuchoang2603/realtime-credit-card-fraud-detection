apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  instances: {{ .Values.instances }}
  imageName: {{ .Values.imageName }}
  enableSuperuserAccess: false
  storage:
    size: {{ .Values.storage.size }}
  resources:
    {{- toYaml .Values.resources | nindent 4 }}
  postgresql:
    parameters:
      wal_level: logical
      max_replication_slots: "16"
      max_wal_senders: "16"
    pg_hba:
      {{- range .Values.databases }}
      - host {{ .name }} {{ join "," .connectRoles }} all scram-sha-256
      {{- end }}
      - host replication payments_cdc all scram-sha-256
      - host all all all reject
  bootstrap:
    initdb:
      database: payments
      owner: payments
      secret:
        name: {{ .Values.name }}-payments
  managed:
    roles:
      {{- range .Values.roles }}
      {{- if ne .name "payments" }}
      - name: {{ .name }}
        ensure: present
        login: true
        replication: {{ default false .replication }}
        passwordSecret:
          name: {{ $.Values.name }}-{{ .name | replace "_" "-" }}
      {{- end }}
      {{- end }}
{{- range .Values.databases }}
{{- if ne .name "payments" }}
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: {{ $.Values.name }}-{{ .name }}
  namespace: {{ $.Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  cluster:
    name: {{ $.Values.name }}
  name: {{ .name }}
  owner: {{ .owner }}
  databaseReclaimPolicy: retain
{{- end }}
{{- end }}
