apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.name }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.name }}
data:
  redis-additional.conf: |
    maxmemory {{ .Values.maxmemory }}
    maxmemory-policy noeviction
    save ""
    appendonly no
---
apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: Redis
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.name }}
spec:
  kubernetesConfig:
    image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
    imagePullPolicy: {{ .Values.image.pullPolicy }}
    redisSecret:
      name: {{ .Values.password.secretName }}
      key: {{ .Values.password.secretKey }}
    resources:
      {{- toYaml .Values.resources | nindent 6 }}
  redisConfig:
    additionalRedisConfig: {{ .Values.name }}-config
  redisExporter:
    enabled: false
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.password.secretName }}
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.externalSecrets.secretStoreRef.kind }}
    name: {{ .Values.externalSecrets.secretStoreRef.name }}
  target:
    name: {{ .Values.password.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.password.secretKey }}
      remoteRef:
        key: {{ .Values.password.remoteKey }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: {{ .Values.name }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- range .Values.clients }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ . }}
        {{- end }}
      ports:
        - port: 6379
          protocol: TCP
