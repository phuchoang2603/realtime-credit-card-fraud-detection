name: payments
mesh:
  callers: [edge]
image:
  repository: ghcr.io/phuchoang2603/payment-gateway-fraud-detection/payments
migrate:
  enabled: true
  env:
    - name: PAYMENTS_MIGRATE_DATABASE_URL
      valueFrom: {secretKeyRef: {name: payments-database, key: migrate-database-url}}
env:
  - name: PAYMENTS_DATABASE_URL
    valueFrom: {secretKeyRef: {name: payments-database, key: database-url}}
  - {name: PAYMENTS_GRPC_ADDR, value: ":8000"}
  - {name: PAYMENTS_TLS_CERT_FILE, value: /etc/payments/tls/tls.crt}
  - {name: PAYMENTS_TLS_KEY_FILE, value: /etc/payments/tls/tls.key}
  - {name: PAYMENTS_HEALTHCHECK_CA_FILE, value: /etc/payments/tls/ca.crt}
  - {name: PAYMENTS_FRAUD_ADDR, value: fraud-service.payment-gateway.svc.cluster.local:8000}
  - {name: PAYMENTS_PROCESSOR_ADDR, value: processor-simulator.payment-gateway.svc.cluster.local:8000}
  - {name: PAYMENTS_REDIS_ADDR, value: payment-gateway-redis.payment-gateway.svc.cluster.local:6379}
  - {name: PAYMENTS_REDIS_PASSWORD_FILE, value: /etc/payments/secrets/redis-password}
  - {name: PAYMENTS_ENCRYPTION_KEY_FILE, value: /etc/payments/secrets/encryption-key}
  - {name: PAYMENTS_CHECKOUT_TOKEN_KEY_FILE, value: /etc/payments/secrets/checkout-token-key}
volumes:
  - name: tls
    secret:
      secretName: payments-tls
  - name: secrets
    secret:
      secretName: payments-secrets
volumeMounts:
  - {name: tls, mountPath: /etc/payments/tls, readOnly: true}
  - {name: secrets, mountPath: /etc/payments/secrets, readOnly: true}
probes:
  type: exec
  exec:
    command: [/app/service, healthcheck]
externalSecrets:
  - name: payments-secrets
    data:
      - {secretKey: redis-password, remoteKey: GATEWAY_REDIS_PASSWORD}
      - {secretKey: encryption-key, remoteKey: GATEWAY_PAYMENTS_ENCRYPTION_KEY}
      - {secretKey: checkout-token-key, remoteKey: GATEWAY_CHECKOUT_TOKEN_KEY}
  - name: payments-database
    template:
      database-url: "postgres://payments_app:{{ .app | urlquery }}@payment-gateway-pg-rw.payment-gateway.svc.cluster.local:5432/payments?sslmode=require"
      migrate-database-url: "postgres://payments:{{ .owner | urlquery }}@payment-gateway-pg-rw.payment-gateway.svc.cluster.local:5432/payments?sslmode=require"
    data:
      - {secretKey: app, remoteKey: GATEWAY_DB_PAYMENTS_APP_PASSWORD}
      - {secretKey: owner, remoteKey: GATEWAY_DB_PAYMENTS_PASSWORD}
networkPolicy:
  ingressPorts: [8000]
  ingressFrom:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: edge
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi
