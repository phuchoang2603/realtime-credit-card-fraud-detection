name: edge
image:
  repository: ghcr.io/phuchoang2603/payment-gateway-fraud-detection/edge
ports:
  - name: http
    containerPort: 8080
probes:
  type: http
  httpPort: 8080
env:
  - {name: EDGE_HTTP_ADDR, value: ":8080"}
  - {name: EDGE_INTEGRATIONS_FILE, value: /etc/edge/integrations/integrations.json}
  - {name: EDGE_PAYMENTS_ADDR, value: payments.payment-gateway.svc.cluster.local:8000}
  - {name: EDGE_PAYMENTS_CA_FILE, value: /etc/edge/pki/ca.crt}
  - {name: EDGE_VAULT_ADDRESS, value: vault-simulator.payment-gateway.svc.cluster.local:8000}
  - {name: EDGE_VAULT_CA_FILE, value: /etc/edge/pki/ca.crt}
  - {name: EDGE_VAULT_CREDENTIAL_FILE, value: /etc/edge/secrets/vault-credential}
  - {name: EDGE_PUBLIC_BASE_URL, value: "https://pay-gateway.phuchoang.sbs"}
  - {name: EDGE_TRUSTED_PROXY_HEADER, value: X-Forwarded-For}
  - {name: EDGE_TRUSTED_PROXY_HOPS, value: "1"}
  - {name: EDGE_SYNTHETIC_FINGERPRINT_KEY, value: synthetic-fingerprint-v1}
  - {name: EDGE_FINGERPRINT_KEY_FILE, value: /etc/edge/secrets/fingerprint-key}
  - {name: EDGE_CHECKOUT_COOKIE_KEY_FILE, value: /etc/edge/secrets/cookie-key}
volumes:
  - name: integrations
    secret:
      secretName: edge-integrations
  - name: secrets
    secret:
      secretName: edge-secrets
  - name: pki
    secret:
      secretName: gateway-internal-ca
      items:
        - {key: ca.crt, path: ca.crt}
volumeMounts:
  - {name: integrations, mountPath: /etc/edge/integrations, readOnly: true}
  - {name: secrets, mountPath: /etc/edge/secrets, readOnly: true}
  - {name: pki, mountPath: /etc/edge/pki, readOnly: true}
externalSecrets:
  - name: edge-integrations
    data:
      - {secretKey: integrations.json, remoteKey: GATEWAY_INTEGRATIONS_JSON}
  - name: edge-secrets
    data:
      - {secretKey: vault-credential, remoteKey: GATEWAY_VAULT_EDGE_CREDENTIAL}
      - {secretKey: fingerprint-key, remoteKey: GATEWAY_FINGERPRINT_KEY}
      - {secretKey: cookie-key, remoteKey: GATEWAY_CHECKOUT_COOKIE_KEY}
networkPolicy:
  ingressPorts: [8080]
  ingressFrom:
    - podSelector:
        matchLabels:
          gateway.networking.k8s.io/gateway-name: payment-gateway-ingress
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ecommerce
httpRoute:
  enabled: true
  gateway: payment-gateway-ingress
  hostnames: ["pay-gateway.phuchoang.sbs"]
  pathPrefix: /checkout/
  port: 8080
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi
