{{- with .Values.networkPolicy.egress }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $.Values.name }}-egress
  namespace: {{ $.Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      {{- include "gateway-service.selector" $ | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    {{- toYaml . | nindent 4 }}
{{- end }}
