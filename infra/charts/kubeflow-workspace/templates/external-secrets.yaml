apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mlpipeline-minio-artifact
  namespace: fraud-ml-prod
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.secretStoreName }}
  target:
    name: mlpipeline-minio-artifact
  data:
    - secretKey: accesskey
      remoteRef:
        key: KUBEFLOW_RUSTFS_ACCESS_KEY
    - secretKey: secretkey
      remoteRef:
        key: KUBEFLOW_RUSTFS_SECRET_KEY
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: model-registry-db-secrets
  namespace: fraud-ml-prod
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.secretStoreName }}
  target:
    name: model-registry-db-secrets
    template:
      engineVersion: v2
      data:
        POSTGRES_USER: root
        POSTGRES_PASSWORD: {{ `"{{ .password }}"` }}
  data:
    - secretKey: password
      remoteRef:
        key: KUBEFLOW_REGISTRY_DB_PASSWORD
{{- if .Values.historicalSource.enabled }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: historical-source
  namespace: fraud-ml-prod
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.secretStoreName }}
  target:
    name: historical-source
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: HISTORICAL_RUSTFS_ACCESS_KEY
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: HISTORICAL_RUSTFS_SECRET_KEY
{{- end }}
