apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gateway-internal-ca
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: {{ .Values.secretStore.name }}
  target:
    name: gateway-internal-ca
    creationPolicy: Owner
  data:
    - secretKey: ca.crt
      remoteRef:
        key: GATEWAY_INTERNAL_CA_CERT
{{- range .Values.pki.certificates }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .name }}-tls
  namespace: {{ $.Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: {{ $.Values.secretStore.name }}
  target:
    name: {{ .name }}-tls
    creationPolicy: Owner
    template:
      type: kubernetes.io/tls
  data:
    - secretKey: tls.crt
      remoteRef:
        key: {{ .remotePrefix }}_TLS_CERT
    - secretKey: tls.key
      remoteRef:
        key: {{ .remotePrefix }}_TLS_KEY
    - secretKey: ca.crt
      remoteRef:
        key: GATEWAY_INTERNAL_CA_CERT
{{- end }}
