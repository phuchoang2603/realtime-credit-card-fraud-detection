apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ .Values.secretStore.name }}
  namespace: {{ .Release.Namespace }}
spec:
  provider:
    doppler:
      project: {{ .Values.secretStore.project }}
      config: {{ .Values.secretStore.config }}
      auth:
        secretRef:
          dopplerToken:
            name: {{ .Values.secretStore.tokenSecret.name }}
            key: {{ .Values.secretStore.tokenSecret.key }}
