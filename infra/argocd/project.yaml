apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: realtime-credit-card-fraud-detection
  namespace: argo-cd
spec:
  description: Applications managed by the payment-gateway-fraud-detection repository
  sourceRepos:
    - https://github.com/phuchoang2603/payment-gateway-fraud-detection.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "*"
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
