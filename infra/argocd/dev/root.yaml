apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: payment-gateway-dev-root
  namespace: argo-cd
  finalizers:
    - resources-finalizer.argocd.argoproj.io/foreground
spec:
  project: realtime-credit-card-fraud-detection
  source:
    repoURL: https://github.com/phuchoang2603/realtime-credit-card-fraud-detection.git
    targetRevision: &revision main
    path: infra/argocd/app-of-apps
    helm:
      releaseName: payment-gateway-dev
      valuesObject:
        global:
          targetRevision: *revision
        namePrefix: payment-gateway-dev
        destinationName: dev
  destination:
    server: https://kubernetes.default.svc
    namespace: argo-cd
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
