apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: payment-gateway-prod-root
  namespace: argo-cd
  finalizers:
    - resources-finalizer.argocd.argoproj.io/foreground
spec:
  project: realtime-credit-card-fraud-detection
  source:
    repoURL: https://github.com/phuchoang2603/payment-gateway-fraud-detection.git
    # TEMP: verification of build-minimum-payment-gateway; revert to main before merge.
    targetRevision: &revision feat/build-minimum-payment-gateway
    path: infra/argocd/app-of-apps
    helm:
      releaseName: payment-gateway-prod
      valuesObject:
        global:
          targetRevision: *revision
        namePrefix: payment-gateway-prod
        destinationServer: https://kubernetes.default.svc
        applications:
          fraud-service:
            enabled: true
            valuesFile:
              - infra/charts/fraud-service/values-prod.yaml
            syncRetry: &retry
              limit: -1
              backoff:
                duration: 5s
                factor: 2
                maxDuration: 3m
          gateway-platform:
            enabled: true
            destinationNamespace: payment-gateway
            path: infra/charts/gateway-platform
            valuesFile:
              - infra/charts/gateway-platform/values-prod.yaml
            syncRetry: *retry
          gateway-database:
            enabled: true
            destinationNamespace: payment-gateway
            path: infra/charts/gateway-database
            valuesFile:
              - infra/charts/gateway-database/values-prod.yaml
            syncRetry: *retry
          gateway-redis:
            enabled: true
            destinationNamespace: payment-gateway
            path: infra/charts/gateway-redis
            valuesFile:
              - infra/charts/gateway-redis/values-prod.yaml
            syncRetry: *retry
          kafka:
            enabled: true
            destinationNamespace: payment-gateway
            path: infra/charts/kafka
            valuesFile:
              - infra/charts/kafka/values-prod.yaml
            syncRetry: *retry
          vault-simulator:
            enabled: true
            destinationNamespace: payment-gateway
            path: infra/charts/gateway-service
            valuesFile:
              - infra/charts/gateway-service/services/vault-simulator.yaml
              - infra/charts/gateway-service/values-prod.yaml
            syncRetry: *retry
          processor-simulator:
            enabled: true
            destinationNamespace: payment-gateway
            path: infra/charts/gateway-service
            valuesFile:
              - infra/charts/gateway-service/services/processor-simulator.yaml
              - infra/charts/gateway-service/values-prod.yaml
            syncRetry: *retry
          payments:
            enabled: true
            destinationNamespace: payment-gateway
            path: infra/charts/gateway-service
            valuesFile:
              - infra/charts/gateway-service/services/payments.yaml
              - infra/charts/gateway-service/values-prod.yaml
            syncRetry: *retry
          notifier:
            enabled: true
            destinationNamespace: payment-gateway
            path: infra/charts/gateway-service
            valuesFile:
              - infra/charts/gateway-service/services/notifier.yaml
              - infra/charts/gateway-service/values-prod.yaml
            syncRetry: *retry
          edge:
            enabled: true
            destinationNamespace: payment-gateway
            path: infra/charts/gateway-service
            valuesFile:
              - infra/charts/gateway-service/services/edge.yaml
              - infra/charts/gateway-service/values-prod.yaml
            syncRetry: *retry
          secret-store:
            enabled: true
            destinationNamespace: argo-cd
            path: infra/charts/secret-store
            valuesFile:
              - infra/charts/secret-store/values-prod.yaml
            syncRetry:
              limit: -1
              backoff:
                duration: 5s
                factor: 2
                maxDuration: 3m
          kubeflow-workspace:
            enabled: true
            destinationNamespace: argo-cd
            path: infra/charts/kubeflow-workspace
            syncRetry:
              limit: -1
              backoff:
                duration: 5s
                factor: 2
                maxDuration: 3m
  destination:
    server: https://kubernetes.default.svc
    namespace: argo-cd
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
